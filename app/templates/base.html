<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventaire ARV{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">📦 Inventaire ARV</div>
    <nav>
      <a href="/">Tableau de bord</a>
      <a href="/inventory">Inventaire</a>
      <a href="/loans/active">Qui a quoi</a>
      <a href="/loans">Historique</a>
      <a href="/members">Membres</a>
      <a href="/parties">Comités</a>
    </nav>
  </header>
  <main class="container">
    {% if request.query_params.get('msg') %}
      <div class="flash">{{ request.query_params.get('msg') }}</div>
    {% endif %}
    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
